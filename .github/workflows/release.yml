name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: windows-11-arm
            name: windows-arm64
          - os: macos-15
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test,build]"
      - run: python -m pytest -q
      - run: python scripts/build.py
      - name: Smoke test executable
        run: python scripts/smoke_frozen.py dist/codex-any-bot/codex-any-bot
      - name: Verify install and complete local uninstall
        run: python scripts/smoke_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release
      - run: cp install/install.ps1 install/install.sh release/
      - run: python scripts/manifest.py release --version "$GITHUB_REF_NAME"
      - name: Publish immutable version assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release download "$GITHUB_REF_NAME" --dir verify-existing
            python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('verify-existing')
          manifest = json.loads((root / 'manifest.json').read_text())
          assert manifest['version'] == os.environ['GITHUB_REF_NAME']
          expected = {p.name for p in Path('release').iterdir() if p.is_file() and p.name != 'manifest.json'}
          assert set(manifest['files']) == expected, 'Published release is incomplete'
          for name, meta in manifest['files'].items():
              data = (root / name).read_bytes()
              assert len(data) == meta['size'], name
              assert hashlib.sha256(data).hexdigest() == meta['sha256'], name
          print('Existing release verified; preserving immutable published assets.')
          PY
          else
            gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
